services:
  api:
    image: ghcr.io/eray114514/hilihili-player:backend
    command: node --import tsx node_modules/@hilihili/api/src/index.ts
    environment:
      HILI_API_HOST: ${HILI_API_HOST:-0.0.0.0}
      HILI_API_PORT: ${HILI_API_PORT:-4141}
      HILI_DATA_DIR: /data
      # 目录浏览白名单（/fs/roots、/fs/list）：容器内只允许浏览挂载进来的媒体根。
      # 不设的话这两个接口会枚举整机文件系统（Windows 下是 A:-Z: 全盘）。
      HILI_FS_ROOTS: /media
      # 需要额外放行的跨域来源（逗号分隔）。默认只放行回环与私有网段。
      HILI_ALLOWED_ORIGINS: ${HILI_ALLOWED_ORIGINS:-}
    ports:
      - "4141:4141"
    volumes:
      - hilihili-data:/data
      - ${HILI_MEDIA_ROOT:-/media}:/media
    networks:
      - backend
    restart: unless-stopped

  worker:
    image: ghcr.io/eray114514/hilihili-player:backend
    command: node --import tsx node_modules/@hilihili/worker/src/index.ts
    environment:
      HILI_DATA_DIR: /data
      HILI_SCAN_INTERVAL_MS: ${HILI_SCAN_INTERVAL_MS:-900000}
      HILI_WATCH_MEDIA: ${HILI_WATCH_MEDIA:-true}
      # 转码（HLS 远程播放产物）
      # 并发：默认 1，避免长时间占满 NAS 的 CPU
      HILI_TRANSCODE_CONCURRENCY: ${HILI_TRANSCODE_CONCURRENCY:-1}
      # 源码率超过这个值才重编码，否则直接 -c copy 切片（零 CPU、无损）
      HILI_HLS_MAX_BITRATE: ${HILI_HLS_MAX_BITRATE:-8000}
      # 切片缓存上限（字节），默认 20GB，超出按最久未播放淘汰
      HILI_HLS_MAX_BYTES: ${HILI_HLS_MAX_BYTES:-21474836480}
      # 留空则自动探测（h264_qsv 优先，失败回退 libx264）
      HILI_HLS_ENCODER: ${HILI_HLS_ENCODER:-}
      # 每次扫描补货的预热任务数，0 关闭预热
      HILI_HLS_WARMUP: ${HILI_HLS_WARMUP:-12}
    # QSV 硬件编码需要核显设备节点；没有核显的环境删掉这行即可（会自动回退软编）
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - hilihili-data:/data
      - ${HILI_MEDIA_ROOT:-/media}:/media
    networks:
      - backend
    restart: unless-stopped

  web:
    image: ghcr.io/eray114514/hilihili-player:web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:4141}
    ports:
      - "3001:3000"
    depends_on:
      - api
    networks:
      - backend
    restart: unless-stopped

  updater:
    image: docker:cli
    working_dir: /workspace
    environment:
      HILI_COMPOSE_DIR: /workspace
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          /workspace/scripts/nas-update.sh
          sleep 900
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
    networks:
      - backend
    restart: unless-stopped

  deploy-console:
    image: ghcr.io/eray114514/hilihili-player:deploy-console
    env_file:
      - .deploy.env
    environment:
      PORT: 8787
      DEPLOY_PROJECTS: '[{"id":"hilihili","name":"Hilihili Player","directory":"/workspace","project":"hilihili","services":["api","worker","web"]}]'
    ports:
      - "8787:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
      - deploy-console-data:/data
    networks:
      - backend
    restart: unless-stopped

volumes:
  hilihili-data:
  deploy-console-data:

networks:
  backend:
    driver: bridge
