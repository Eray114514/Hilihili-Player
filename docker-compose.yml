services:
  api:
    image: ghcr.io/eray114514/hilihili-player:backend
    command: node --import tsx node_modules/@hilihili/api/src/index.ts
    environment:
      HILI_API_HOST: ${HILI_API_HOST:-0.0.0.0}
      HILI_API_PORT: ${HILI_API_PORT:-4141}
      HILI_DATA_DIR: /data
    ports:
      - "4141:4141"
    volumes:
      - hilihili-data:/data
      - ${HILI_MEDIA_ROOT:-/media}:/media
    networks:
      - backend
    restart: unless-stopped

  worker:
    image: ghcr.io/eray114514/hilihili-player:backend
    command: node --import tsx node_modules/@hilihili/worker/src/index.ts
    environment:
      HILI_DATA_DIR: /data
      HILI_SCAN_INTERVAL_MS: ${HILI_SCAN_INTERVAL_MS:-900000}
      HILI_WATCH_MEDIA: ${HILI_WATCH_MEDIA:-true}
    volumes:
      - hilihili-data:/data
      - ${HILI_MEDIA_ROOT:-/media}:/media
    networks:
      - backend
    restart: unless-stopped

  web:
    image: ghcr.io/eray114514/hilihili-player:web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:4141}
    ports:
      - "3001:3000"
    depends_on:
      - api
    networks:
      - backend
    restart: unless-stopped

  updater:
    image: docker:cli
    working_dir: /workspace
    environment:
      HILI_COMPOSE_DIR: /workspace
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          /workspace/scripts/nas-update.sh
          sleep 900
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
    networks:
      - backend
    restart: unless-stopped

  deploy-console:
    image: ghcr.io/eray114514/hilihili-player:deploy-console
    env_file:
      - .deploy.env
    environment:
      PORT: 8787
      DEPLOY_PROJECTS: '[{"id":"hilihili","name":"Hilihili Player","directory":"/workspace","project":"hilihili","services":["api","worker","web"]}]'
    ports:
      - "8787:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
      - deploy-console-data:/data
    networks:
      - backend
    restart: unless-stopped

volumes:
  hilihili-data:
  deploy-console-data:

networks:
  backend:
    driver: bridge
